name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            accept-flake-config = true
      - uses: sigstore/cosign-installer@v3
      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | skopeo login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Check
        run: nix develop --command just check
      - name: Publish image
        run: nix run .#postgresql-18-cnpg-image.copyToRegistry
      - name: Load image for SBOM
        run: nix run .#postgresql-18-cnpg-image.copyToDockerDaemon
      - name: Generate SBOM
        run: nix develop --command just sbom
      - name: Sign image
        run: cosign sign --yes ghcr.io/singularity-ng/centralcloud-postgres:18-cnpg-ext
      - name: Attach SBOM
        run: cosign attach sbom --sbom dist/sbom.spdx.json ghcr.io/singularity-ng/centralcloud-postgres:18-cnpg-ext
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: dist/sbom.spdx.json
