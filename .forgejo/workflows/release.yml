# Builds and publishes the CentralCloud PostgreSQL 18 CNPG image on version tags
# AND on pushes to the default branch, so the canonical operand image stays
# fresh in both the internal registry and the GHCR public mirror.
#
# Produces (same digest in both registries when GHCR secrets are present):
#   git.infra.centralcloud.com/centralcloud/centralcloud-postgres:18-cnpg-ext
#   ghcr.io/singularity-ng/centralcloud-postgres:18-cnpg-ext
#
# Secrets required (repo or org level):
#   REGISTRY_USER     — Forgejo user with write access to the internal registry
#   REGISTRY_PASSWORD — Forgejo personal access token or password
#   GHCR_USER         — GitHub user with write access to ghcr.io/singularity-ng
#   GHCR_TOKEN        — GitHub PAT with `write:packages` scope
name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  publish:
    name: Build & push postgres image
    # Host Nix via forgejo-runner (/nix socket). Do not use
    # cachix/install-nix-action — data.forgejo.org does not mirror it.
    runs-on: [nix, nixos-26.05, self-hosted]
    env:
      HOME: /tmp
      XDG_CACHE_HOME: /tmp/.cache
      XDG_CONFIG_HOME: /tmp/.config
    steps:
      - uses: actions/checkout@v4

      - name: Verify runner-provided Nix
        run: |
          set -euo pipefail
          which nix
          nix --version
          mkdir -p "$XDG_CONFIG_HOME/nix"
          if ! grep -qF 'experimental-features = nix-command flakes' "$XDG_CONFIG_HOME/nix/nix.conf" 2>/dev/null; then
            echo 'experimental-features = nix-command flakes' >> "$XDG_CONFIG_HOME/nix/nix.conf"
            echo 'accept-flake-config = true' >> "$XDG_CONFIG_HOME/nix/nix.conf"
          fi

      - name: Precheck — required secrets present
        env:
          REGISTRY_USER: ${{ secrets.REGISTRY_USER }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
          GHCR_USER: ${{ secrets.GHCR_USER }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: |
          set -euo pipefail
          missing=()
          for var in REGISTRY_USER REGISTRY_PASSWORD; do
            if [ -z "${!var:-}" ]; then missing+=("$var"); fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing required Forgejo secrets: ${missing[*]}"
            echo "Provision under repo or org settings → Actions → Secrets:"
            echo "  REGISTRY_USER     — Forgejo user with write to the internal registry"
            echo "  REGISTRY_PASSWORD — that user's PAT or password"
            echo "  GHCR_USER         — GitHub user with write to ghcr.io/singularity-ng (optional; if missing, GHCR mirror is skipped)"
            echo "  GHCR_TOKEN        — GitHub PAT with write:packages scope (optional)"
            exit 1
          fi
          if [ -z "${GHCR_USER:-}" ] || [ -z "${GHCR_TOKEN:-}" ]; then
            echo "::warning::GHCR_USER or GHCR_TOKEN missing — internal registry will be updated, GHCR mirror will be SKIPPED for this run. Provision the secrets to keep the public mirror in sync."
            echo "PUSH_TARGET=internal" >> "$GITHUB_ENV"
          else
            echo "PUSH_TARGET=both" >> "$GITHUB_ENV"
          fi

      - name: Login to internal registry
        env:
          REGISTRY_USER: ${{ secrets.REGISTRY_USER }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: |
          set -euo pipefail
          authfile="${XDG_CONFIG_HOME}/containers/auth.json"
          mkdir -p "$(dirname "$authfile")"
          printf '%s' "$REGISTRY_PASSWORD" |
            skopeo login --authfile "$authfile" --username "$REGISTRY_USER" --password-stdin registry.infra.centralcloud.com
          echo "REGISTRY_AUTH_FILE=$authfile" >> "$GITHUB_ENV"

      - name: Login to GHCR
        if: env.PUSH_TARGET == 'both'
        env:
          GHCR_USER: ${{ secrets.GHCR_USER }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: |
          set -euo pipefail
          authfile="${REGISTRY_AUTH_FILE:-${XDG_CONFIG_HOME}/containers/auth.json}"
          mkdir -p "$(dirname "$authfile")"
          printf '%s' "$GHCR_TOKEN" |
            skopeo login --authfile "$authfile" --username "$GHCR_USER" --password-stdin ghcr.io
          echo "REGISTRY_AUTH_FILE=$authfile" >> "$GITHUB_ENV"

      - name: Build and push image(s)
        env:
          REGISTRY_USER: ${{ secrets.REGISTRY_USER }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
          GHCR_USER: ${{ secrets.GHCR_USER }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: |
          set -euo pipefail
          if [ "${PUSH_TARGET}" = "both" ]; then
            PUSH=both ./scripts/build-postgres18-cnpg-image.sh
          else
            PUSH=1 ./scripts/build-postgres18-cnpg-image.sh
          fi

      - name: Generate SBOM
        env:
          REGISTRY_AUTH_FILE: ${{ env.REGISTRY_AUTH_FILE }}
        run: |
          set -euo pipefail
          mkdir -p dist
          nix shell nixpkgs#syft --accept-flake-config -c syft \
            registry.infra.centralcloud.com/centralcloud/centralcloud-postgres:18-cnpg-ext \
            -o spdx-json=dist/sbom.spdx.json

      - name: Upload SBOM artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: dist/sbom.spdx.json
