# Builds and publishes the CentralCloud PostgreSQL 18 CNPG image on version tags.
#
# Produces:
#   registry.infra.centralcloud.com/centralcloud/centralcloud-postgres:18-cnpg-ext
#
# Secrets required (repo or org level):
#   REGISTRY_USER     — Forgejo user with write access to the package registry
#   REGISTRY_PASSWORD — Forgejo personal access token or password
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  REGISTRY: registry.infra.centralcloud.com
  IMAGE: centralcloud/centralcloud-postgres
  TAG: 18-cnpg-ext

jobs:
  publish:
    name: Build & push postgres image
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            accept-flake-config = true

      - name: Login to internal registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push image
        run: nix run --option builders "" .#postgresql-18-cnpg-image.copyToRegistry

      - name: Smoke test
        run: just smoke-image

      - name: Generate SBOM
        run: just sbom

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: dist/sbom.spdx.json
