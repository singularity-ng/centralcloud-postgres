# Builds and publishes the CentralCloud PostgreSQL 18 CNPG image on version tags
# AND on pushes to the default branch — so the canonical operand image stays
# fresh in both the internal registry and the GHCR public mirror.
#
# Produces (same digest in both):
#   registry.infra.centralcloud.com/centralcloud/centralcloud-postgres:18-cnpg-ext
#   ghcr.io/singularity-ng/centralcloud-postgres:18-cnpg-ext
#
# Secrets required (repo or org level):
#   REGISTRY_USER     — Forgejo user with write access to the internal registry
#   REGISTRY_PASSWORD — Forgejo personal access token or password
#   GHCR_USER         — GitHub user with write access to ghcr.io/singularity-ng
#   GHCR_TOKEN        — GitHub PAT with `write:packages` scope
name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

env:
  REGISTRY: registry.infra.centralcloud.com
  IMAGE: centralcloud/centralcloud-postgres
  TAG: 18-cnpg-ext
  GHCR_REGISTRY: ghcr.io
  GHCR_IMAGE: singularity-ng/centralcloud-postgres

jobs:
  publish:
    name: Build & push postgres image
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            accept-flake-config = true

      - name: Login to internal registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ secrets.GHCR_USER }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push to internal registry + GHCR mirror
        run: PUSH=both ./scripts/build-postgres18-cnpg-image.sh

      - name: Smoke test
        run: just smoke-image

      - name: Generate SBOM
        run: just sbom

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: dist/sbom.spdx.json
